name: Docs deploy

# Build Docusaurus từ docs/ và deploy lên GitHub Pages.
# Chạy khi: push vào main chạm docs/website; được gọi từ merge-log.yml; hoặc thủ công.
# Lần đầu: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs-deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # cần cho "last updated" của Docusaurus
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Tính URL/baseUrl cho GitHub Pages
        id: pages
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/${repo}/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          DOCS_URL: ${{ steps.pages.outputs.url }}
          DOCS_BASE_URL: ${{ steps.pages.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
