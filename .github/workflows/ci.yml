name: Repo checks

# Kiểm tra chung cho mọi PR (không thuộc riêng backend hay frontend):
#   - tiêu đề PR đúng Conventional Commits (squash merge dùng tiêu đề này làm commit trên main)
#   - build site docs khi docs/website đổi (link hỏng → fail)
#   - nhắc cập nhật docs khi code đổi mà docs không đổi
# CI/CD của từng app nằm ở backend.yml và frontend.yml; tổng quan: docs/20-ci-cd.md

on:
  pull_request:
    branches: [main]

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Repo · detect changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'website/**'
              - 'CHANGELOG.md'
            code:
              - 'backend-portfolio/src/**'
              - 'frontend-portfolio/src/**'

  pr-title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Mô tả bắt đầu bằng chữ thường, ví dụ "feat(be): add project entity".'

  docs:
    name: Docs · build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  docs-reminder:
    name: Nhắc cập nhật docs
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- docs-reminder -->';
            const body = `${marker}
            📚 **PR này thay đổi code nhưng không chạm \`docs/\`, \`website/\` hay \`CHANGELOG.md\`.**

            Theo [quy trình](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/19-docs-workflow.md#3-quy-tắc-code-đổi-thì-docs-đổi), hãy:
            - cập nhật spec/ADR/contract hoặc thêm dòng vào \`CHANGELOG.md\` mục Unreleased, **hoặc**
            - ghi trong mô tả PR vì sao không cần (reviewer quyết định).

            _Comment tự động, không chặn merge._`;
            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            }
